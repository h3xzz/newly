name: Simple Artifact Examplef

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Create a file and upload it as an artifact
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Generate output file
        run: |
          mkdir -p output
          echo "Build completed at $(date)" > output/build-report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: output/build-report.txt
          retention-days: 5

  # Job 2: Download the artifact created in Job 1
  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: downloaded-output

      - name: Read artifact contents
        run: cat downloaded-output/build-report.txt
